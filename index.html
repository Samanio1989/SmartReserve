function confirmDialog({title='ยืนยันการดำเนินการ',message='',confirmText='ยืนยัน',danger=false}={}){
  return new Promise(resolve=>{
    modal(`<div>
      <div class="flex items-start justify-between gap-4">
        <div class="w-12 h-12 rounded-2xl ${danger?'bg-red-50 text-red-600':'bg-blue-50 text-blue-700'} flex items-center justify-center shrink-0">
          ${icon(danger?'trash-2':'circle-help','w-6 h-6')}
        </div>
        <button type="button" id="confirmClose" class="p-1 text-slate-400 hover:text-slate-700">${icon('x','w-5 h-5')}</button>
      </div>
      <h3 class="text-xl font-semibold mt-4">${esc(title)}</h3>
      <p class="text-sm text-slate-600 mt-2 leading-6">${esc(message)}</p>
      <div class="flex gap-3 mt-6">
        <button type="button" id="confirmCancel" class="btn bg-slate-100 flex-1">ยกเลิก</button>
        <button type="button" id="confirmOk" class="btn ${danger?'bg-red-600 text-white hover:bg-red-700':'btn-primary'} flex-1">${esc(confirmText)}</button>
      </div>
    </div>`);
    const finish=(value)=>{ closeModal(); resolve(value); };
    $('#confirmCancel').onclick=()=>finish(false);
    $('#confirmClose').onclick=()=>finish(false);
    $('#confirmOk').onclick=()=>finish(true);
  });
}

async function loadAll(){loading(true,'กำลังโหลดข้อมูล...');try{const req=[safe(dbClient.from('students').select('*').order('student_code')),safe(dbClient.from('activities').select('*').order('activity_date',{ascending:false})),safe(dbClient.from('activity_registrations').select('*')),safe(dbClient.from('activity_attendance').select('*')),safe(dbClient.from('activity_benefits').select('*')),safe(dbClient.from('activity_faculties').select('*')),safe(dbClient.from('activity_majors').select('*')),safe(dbClient.from('activity_student_types').select('*')),safe(dbClient.from('activity_years').select('*')),safe(dbClient.from('activity_specific_students').select('*'))];if(isAdmin())req.push(safe(dbClient.from('users').select('id,username,full_name,role,student_id,is_active,created_at').order('created_at')));let r=await Promise.all(req);[students,activities,registrations,attendance,benefits,criteria.faculties,criteria.majors,criteria.types,criteria.years,criteria.specific]=r;users=isAdmin()?r[10]:[];}catch(e){toast(e.message,'err')}finally{loading(false)}}

function activityStartDate(a){

function cancellationState(a){

  let now=new Date();
  return {
    allowed:now<cutoff,
    cutoff,
    message:now<cutoff
      ? `ยกเลิกได้ถึง ${cutoff.toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})} น.`

async function compressImage(file){return new Promise((res,rej)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let max=1600,scale=Math.min(1,max/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(url);b?res(b):rej(new Error('บีบอัดภาพไม่สำเร็จ'))},'image/webp',.72)};img.onerror=()=>rej(new Error('อ่านไฟล์ภาพไม่สำเร็จ'));img.src=url})}

  let selectedBenefit=new FormData(e.target).get('selected_benefit');
  if(!selectedBenefit)return toast('กรุณาเลือกสิทธิประโยชน์ 1 อย่าง','err');
  loading(true,'กำลังลงทะเบียน...');
  try{
    await safe(dbClient.rpc('register_activity',{p_activity_id:id,p_student_id:session.student_id,p_registered_by:session.id,p_selected_benefit:selectedBenefit,p_admin_override:false}));
    closeModal(); await loadAll(); renderActivities(); toast('ลงทะเบียนสำเร็จ');
  }catch(e){toast(e.message,'err')}finally{loading(false)}
}

function editRegisteredBenefit(id){
  let a=activities.find(x=>x.id===id); if(!a)return;
  let reg=registrations.find(r=>r.activity_id===id&&r.student_id===session.student_id&&r.registration_status==='registered');
  if(!reg)return toast('ไม่พบรายการลงทะเบียน','err');
  let att=attendance.find(x=>x.registration_id===reg.id);
  if(att && ['present','late','absent'].includes(att.status)){
    return toast('ไม่สามารถแก้ไขสิทธิประโยชน์ได้ เนื่องจากเจ้าหน้าที่เช็กชื่อแล้ว','err');
  }
  let opts=benefits.filter(x=>x.activity_id===id).map(x=>x.benefit_type);
  modal(`<form onsubmit="saveRegisteredBenefit(event,'${id}')">
    <div class="flex justify-between items-start gap-4">
      <div><h3 class="text-xl font-semibold">แก้ไขสิทธิประโยชน์</h3><p class="text-sm text-slate-600 mt-1">${esc(a.title)}</p></div>
      <button type="button" onclick="closeModal()" class="p-1 text-slate-400">${icon('x')}</button>
    </div>
    <p class="text-xs text-slate-500 mt-5 mb-3">เลือกได้ 1 อย่าง และแก้ไขได้จนกว่า Admin/เจ้าหน้าที่จะเช็กชื่อ</p>
    <div class="space-y-2">${opts.map(x=>`<label class="flex items-center gap-3 p-3 border rounded-xl cursor-pointer hover:bg-blue-50"><input type="radio" name="selected_benefit" value="${esc(x)}" ${reg.selected_benefit===x?'checked':''} required><span>${esc(x)}</span></label>`).join('')}</div>
    <div class="flex gap-3 mt-6"><button type="button" onclick="closeModal()" class="btn bg-slate-100 flex-1">ยกเลิก</button><button class="btn btn-primary flex-1">บันทึกการเปลี่ยนแปลง</button></div>
  </form>`);
}
async function saveRegisteredBenefit(e,id){
  e.preventDefault();
  let selectedBenefit=new FormData(e.target).get('selected_benefit');
  loading(true,'กำลังแก้ไขสิทธิประโยชน์...');
  try{
    await safe(dbClient.rpc('update_registration_benefit',{p_activity_id:id,p_student_id:session.student_id,p_selected_benefit:selectedBenefit}));
    closeModal(); await loadAll(); renderActivities(); toast('แก้ไขสิทธิประโยชน์เรียบร้อยแล้ว');
  }catch(e){toast(e.message,'err')}finally{loading(false)}
}

async function cancelReg(id){
  let a=activities.find(x=>x.id===id),cs=cancellationState(a);
  if(!cs.allowed)return toast(cs.message,'err');
  let ok=await confirmDialog({title:'ยืนยันการยกเลิก',message:`ต้องการยกเลิกการลงทะเบียน “${a?.title||''}” หรือไม่? ${cs.message}`,confirmText:'ยกเลิกการลงทะเบียน',danger:true});
  if(!ok)return;
  loading(true,'กำลังยกเลิกการลงทะเบียน...');
  try{
    await safe(dbClient.rpc('cancel_activity_registration',{p_activity_id:id,p_student_id:session.student_id,p_admin_override:false}));
    await loadAll(); renderActivities(); toast('ยกเลิกการลงทะเบียนแล้ว');
  }catch(e){toast(e.message,'err')}finally{loading(false)}
}

function togglePassword(id,btn){
  let input=document.getElementById(id); if(!input)return;
  input.type=input.type==='password'?'text':'password';
  btn.innerHTML=icon(input.type==='password'?'eye':'eye-off','w-4 h-4'); refreshIcons();
}
async function saveStudent(e,id){
  e.preventDefault();
  let f=new FormData(e.target);
  let p={
    student_code:(f.get('student_code')||'').trim(),
    full_name:(f.get('full_name')||'').trim(),
    faculty:f.get('faculty'),
    major:(f.get('major')||'').trim(),
    year_level:+f.get('year_level'),
    student_type:f.get('student_type'),
    phone:(f.get('phone')||'').trim()
  };
  loading(true,id?'กำลังบันทึกข้อมูลนักศึกษา...':'กำลังสร้างนักศึกษาและบัญชีผู้ใช้...');
  let newStudentId=null;
  try{
    if(id){
      await safe(dbClient.from('students').update(p).eq('id',id));
      let linked=users.find(u=>u.student_id===id);
      if(linked){
        await safe(dbClient.from('users').update({username:p.student_code,full_name:p.full_name}).eq('id',linked.id));
      }
      closeModal(); await loadAll(); renderStudents(); toast('แก้ไขข้อมูลนักศึกษาเรียบร้อยแล้ว');
    }else{
      let initialPassword=f.get('initial_password')||'';
      if(initialPassword.length<6)throw new Error('รหัสผ่านเริ่มต้นต้องมีอย่างน้อย 6 ตัวอักษร');
      if(students.some(s=>s.student_code===p.student_code))throw new Error('รหัสนักศึกษานี้มีอยู่ในระบบแล้ว');
      if(users.some(u=>u.username===p.student_code))throw new Error('ชื่อผู้ใช้งานนี้มีอยู่ในระบบแล้ว');

      let stu=await safe(dbClient.from('students').insert(p).select().single());
      newStudentId=stu.id;
      let usr=await safe(dbClient.from('users').insert({
        username:p.student_code,
        password_hash:'TEMP',
        full_name:p.full_name,
        role:'student',
        student_id:stu.id,
        is_active:true
      }).select('id').single());
      await safe(dbClient.rpc('set_user_password',{p_user_id:usr.id,p_new_password:initialPassword}));

      closeModal(); await loadAll(); renderStudents(); toast('เพิ่มนักศึกษาและสร้างบัญชีเข้าสู่ระบบเรียบร้อยแล้ว');
    }
  }catch(err){
    if(newStudentId){
      try{await dbClient.from('students').delete().eq('id',newStudentId)}catch(_){}
    }
    toast(err.message,'err');
  }finally{loading(false)}
}
async function deleteStudent(id){
  let s=students.find(x=>x.id===id); if(!s)return;
  let ok=await confirmDialog({
    title:'ยืนยันการลบนักศึกษา',
    message:`ต้องการลบ ${s.full_name} (${s.student_code}) หรือไม่? บัญชีเข้าสู่ระบบที่เชื่อมกับนักศึกษารายนี้จะถูกลบด้วย และการดำเนินการนี้ไม่สามารถย้อนกลับได้`,
    confirmText:'ลบนักศึกษา',
    danger:true
  });
  if(!ok)return;
  loading(true,'กำลังลบนักศึกษา...');
  try{
    await safe(dbClient.from('students').delete().eq('id',id));
    await loadAll(); renderStudents(); toast('ลบข้อมูลนักศึกษาเรียบร้อยแล้ว');
  }catch(err){toast(err.message,'err')}finally{loading(false)}
}

function downloadActivityReportCSV(){
  let id=$('#reportActivity')?.value;if(!id)return toast('กรุณาเลือกกิจกรรมก่อนดาวน์โหลด','err');
  let a=activities.find(x=>x.id===id),data=reportRowsForActivity(id),rows=[['ลำดับ','รหัสกิจกรรม','ชื่อกิจกรรม','รหัสนักศึกษา','ชื่อ - สกุล','คณะ','สาขา','ชั้นปี','ประเภทนักศึกษา','เบอร์โทรศัพท์','สิทธิประโยชน์ที่เลือก','สถานะเช็กชื่อ','เวลาเช็กชื่อ'],...data.map((x,i)=>[i+1,a?.activity_code||'',a?.title||'',x.s.student_code,x.s.full_name,x.s.faculty,x.s.major,x.s.year_level,x.s.student_type||'',x.s.phone||'',x.r.selected_benefit||'',x.status,x.checked_at?new Date(x.checked_at).toLocaleString('th-TH'):''])];
  let csv='\ufeff'+rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=`รายงาน_${(a?.activity_code||'activity').replace(/[^a-zA-Z0-9ก-๙_-]/g,'_')}.csv`;link.click();URL.revokeObjectURL(url);toast('ดาวน์โหลดรายงานเรียบร้อยแล้ว');
}
function renderUsers(){if(!isAdmin())return;$('#content').innerHTML=`<div class="flex justify-end mb-4"><button onclick="userForm()" class="btn btn-primary">+ เพิ่มผู้ใช้งาน</button></div><div class="card overflow-x-auto"><table class="w-full text-sm"><thead><tr><th class="p-3 text-left">Username</th><th class="p-3 text-left">ชื่อ</th><th>สิทธิ์</th><th>สถานะ</th><th></th></tr></thead><tbody>${users.map(u=>`<tr class="border-t"><td class="p-3">${esc(u.username)}</td><td class="p-3">${esc(u.full_name)}</td><td class="text-center">${u.role}</td><td class="text-center">${u.is_active?'ใช้งาน':'ปิด'}</td><td class="p-2"><button onclick="userForm('${u.id}')" class="p-2">${icon('pencil','w-4')}</button><button onclick="deleteUser('${u.id}')" class="p-2">${icon('trash-2','w-4')}</button></td></tr>`).join('')}</tbody></table></div>`;refreshIcons()}
function userForm(id){let u=users.find(x=>x.id===id)||{};modal(`<form onsubmit="saveUser(event,'${id||''}')"><div class="flex justify-between"><h3 class="text-xl font-semibold">${id?'แก้ไข':'เพิ่ม'}ผู้ใช้งาน</h3><button type="button" onclick="closeModal()">${icon('x')}</button></div><div class="space-y-4 mt-5"><div><label class="label">Username</label><input name="username" class="input" value="${esc(u.username||'')}" required></div><div><label class="label">ชื่อ - สกุล</label><input name="full_name" class="input" value="${esc(u.full_name||'')}" required></div><div><label class="label">สิทธิ์</label><select name="role" class="input"><option value="student" ${u.role==='student'?'selected':''}>student</option><option value="admin" ${u.role==='admin'?'selected':''}>admin</option></select></div><div><label class="label">ผูกกับนักศึกษา (สำหรับ student)</label><select name="student_id" class="input"><option value="">ไม่ระบุ</option>${students.map(s=>`<option value="${s.id}" ${u.student_id===s.id?'selected':''}>${s.student_code} - ${esc(s.full_name)}</option>`).join('')}</select></div><div><label class="label">${id?'รหัสผ่านใหม่ (เว้นว่างหากไม่เปลี่ยน)':'รหัสผ่าน'}</label><input type="password" name="password" class="input" ${id?'':'required'}></div><label><input type="checkbox" name="is_active" ${u.is_active!==false?'checked':''}> เปิดใช้งาน</label></div><div class="flex gap-3 mt-6"><button type="button" onclick="closeModal()" class="btn bg-slate-100 flex-1">ยกเลิก</button><button class="btn btn-primary flex-1">บันทึก</button></div></form>`)}
async function saveUser(e,id){e.preventDefault();let f=new FormData(e.target),p={username:f.get('username').trim(),full_name:f.get('full_name').trim(),role:f.get('role'),student_id:f.get('student_id')||null,is_active:f.has('is_active')};loading(true);try{let uid=id;if(id)await safe(dbClient.from('users').update(p).eq('id',id));else{p.password_hash='TEMP';let d=await safe(dbClient.from('users').insert(p).select('id').single());uid=d.id}if(f.get('password'))await safe(dbClient.rpc('set_user_password',{p_user_id:uid,p_new_password:f.get('password')}));closeModal();await loadAll();renderUsers();toast('บันทึกผู้ใช้งานแล้ว')}catch(e){toast(e.message,'err')}finally{loading(false)}} async function deleteUser(id){if(id===session.id)return toast('ไม่สามารถลบบัญชีที่กำลังใช้งาน','err');let u=users.find(x=>x.id===id);let ok=await confirmDialog({title:'ยืนยันการลบผู้ใช้งาน',message:`ต้องการลบบัญชี ${u?.username||''} ${u?.full_name?`(${u.full_name})`:''} หรือไม่?`,confirmText:'ลบผู้ใช้งาน',danger:true});if(!ok)return;loading(true,'กำลังลบผู้ใช้งาน...');try{await safe(dbClient.from('users').delete().eq('id',id));await loadAll();renderUsers();toast('ลบผู้ใช้งานเรียบร้อยแล้ว')}catch(e){toast(e.message,'err')}finally{loading(false)}}
function renderMyActivities(){let rs=registrations.filter(r=>r.student_id===session.student_id&&r.registration_status==='registered'),arr=rs.map(r=>activities.find(a=>a.id===r.activity_id)).filter(Boolean);$('#content').innerHTML=`<div class="grid md:grid-cols-2 xl:grid-cols-3 gap-4">${arr.map(activityCard).join('')||'<div class="card p-8 text-center text-slate-400">ยังไม่มีกิจกรรมที่ลงทะเบียน</div>'}</div>`;refreshIcons()}
function renderProfile(){let s=studentSelf();$('#content').innerHTML=`<div class="card p-5 md:p-7 max-w-2xl"><div class="flex items-center gap-4"><div class="w-16 h-16 rounded-2xl bg-blue-100 text-blue-800 grid place-items-center">${icon('user','w-8 h-8')}</div><div><h3 class="text-xl font-semibold">${esc(session.full_name)}</h3><p class="text-slate-500">${session.role}</p></div></div><div class="grid sm:grid-cols-2 gap-4 mt-6">${s?`<div><span class="text-xs text-slate-500">รหัสนักศึกษา</span><p>${s.student_code}</p></div><div><span class="text-xs text-slate-500">คณะ</span><p>${esc(s.faculty)}</p></div><div><span class="text-xs text-slate-500">สาขา</span><p>${esc(s.major)}</p></div><div><span class="text-xs text-slate-500">ชั้นปี</span><p>${s.year_level}</p></div><div><span class="text-xs text-slate-500">ประเภท</span><p>${esc(s.student_type)}</p></div><div><span class="text-xs text-slate-500">โทรศัพท์</span><p>${esc(s.phone||'-')}</p></div>`:`<div><span class="text-xs text-slate-500">Username</span><p>${esc(session.username)}</p></div>`}</div><button onclick="passwordModal()" class="btn btn-soft mt-6">เปลี่ยนรหัสผ่าน</button></div>`;refreshIcons()}
function passwordModal(){modal(`<form onsubmit="changePassword(event)"><h3 class="text-xl font-semibold">เปลี่ยนรหัสผ่าน</h3><label class="label mt-4">รหัสผ่านใหม่</label><input name="password" type="password" minlength="4" class="input" required><div class="flex gap-3 mt-5"><button type="button" onclick="closeModal()" class="btn bg-slate-100 flex-1">ยกเลิก</button><button class="btn btn-primary flex-1">บันทึก</button></div></form>`)} async function changePassword(e){e.preventDefault();try{await safe(dbClient.rpc('set_user_password',{p_user_id:session.id,p_new_password:new FormData(e.target).get('password')}));closeModal();toast('เปลี่ยนรหัสผ่านแล้ว')}catch(e){toast(e.message,'err')}}
(async()=>{let remembered=localStorage.getItem('remember_username');if(remembered){$('#loginUsername').value=remembered;$('#rememberMe').checked=true}let ss=sessionStorage.getItem('activity_session');if(ss){try{session=JSON.parse(ss);await enterApp()}catch{sessionStorage.removeItem('activity_session')}}refreshIcons()})();
</script></body></html>
