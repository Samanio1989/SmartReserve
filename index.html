body{background:var(--aru-bg);color:var(--aru-ink)}

function calendarAcademicYear(){let d=new Date(),be=d.getFullYear()+543;return d.getMonth()>=5?be:be-1}

function derivedYearLevel(studentCode){
  let code=String(studentCode||'').trim(),prefix=code.slice(0,3);

  if(level>=1&&level<=4)return String(level);

  return '';
}
async function syncMyAcademicYear(){

}

function icon(n,c='w-5 h-5'){return `<i data-lucide="${n}" class="${c}"></i>`} function refreshIcons(){lucide.createIcons()}
function loading(v,t='กำลังดำเนินการ...'){$('#loaderText').textContent=t;$('#globalLoader').classList.toggle('hide',!v)}

function esc(v=''){return String(v??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}
function fmtDate(v){if(!v)return '-';return new Intl.DateTimeFormat('th-TH',{dateStyle:'medium'}).format(new Date(v+'T00:00:00'))} function fmtDT(v){if(!v)return '-';return new Intl.DateTimeFormat('th-TH',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v))}
function modal(html){$('#modalBox').innerHTML=html;$('#modal').classList.remove('hide');refreshIcons()} function closeModal(){$('#modal').classList.add('hide')}

function confirmDialog({title='ยืนยันการดำเนินการ',message='',confirmText='ยืนยัน',danger=false}={}){
  return new Promise(resolve=>{
    modal(`<div>
      <div class="flex items-start justify-between gap-4">
        <div class="w-12 h-12 rounded-2xl ${danger?'bg-red-50 text-red-600':'bg-blue-50 text-blue-700'} flex items-center justify-center shrink-0">
          ${icon(danger?'trash-2':'circle-help','w-6 h-6')}
        </div>
        <button type="button" id="confirmClose" class="p-1 text-slate-400 hover:text-slate-700">${icon('x','w-5 h-5')}</button>
      </div>
      <h3 class="text-xl font-semibold mt-4">${esc(title)}</h3>
      <p class="text-sm text-slate-600 mt-2 leading-6">${esc(message)}</p>
      <div class="flex gap-3 mt-6">
        <button type="button" id="confirmCancel" class="btn bg-slate-100 flex-1">ยกเลิก</button>
        <button type="button" id="confirmOk" class="btn ${danger?'bg-red-600 text-white hover:bg-red-700':'btn-primary'} flex-1">${esc(confirmText)}</button>
      </div>
    </div>`);
    const finish=(value)=>{ closeModal(); resolve(value); };
    $('#confirmCancel').onclick=()=>finish(false);
    $('#confirmClose').onclick=()=>finish(false);
    $('#confirmOk').onclick=()=>finish(true);
  });
}

async function loadAllUsers(){
  const pageSize=1000;
  let all=[],from=0;
  while(true){
    const page=await safe(
      dbClient.from('users')
        .select('id,username,full_name,role,student_id,is_active,created_at')
        .order('created_at',{ascending:true})
        .range(from,from+pageSize-1)
    );
    all.push(...(page||[]));
    if(!page||page.length<pageSize)break;
    from+=pageSize;
  }
  return all;
}

function eligibility(a,s){
  if(!s||!a||a.is_visible===false)return false;
  const norm=v=>String(v??'').trim().replace(/\s+/g,' ');
  if(a.target_mode==='specific')return criteria.specific.some(x=>x.activity_id===a.id&&x.student_id===s.id);
  let f=criteria.faculties.filter(x=>x.activity_id===a.id),m=criteria.majors.filter(x=>x.activity_id===a.id),t=criteria.types.filter(x=>x.activity_id===a.id),y=criteria.years.filter(x=>x.activity_id===a.id);
  let facultyOK=!f.length||f.some(x=>['ทุกคณะ','ทั้งหมด','all'].includes(norm(x.faculty).toLowerCase())||norm(x.faculty)===norm(s.faculty));
  let majorOK=!m.length||m.some(x=>['ทุกสาขา','ทั้งหมด','all'].includes(norm(x.major).toLowerCase())||norm(x.major)===norm(s.major));
  let typeOK=!t.length||t.some(x=>['ทุกประเภท','ทั้งหมด','all'].includes(norm(x.student_type).toLowerCase())||norm(x.student_type)===norm(s.student_type));
  let yearOK=!y.length||y.some(x=>['0','ทุกชั้นปี','ทุกปี','ทั้งหมด','all'].includes(norm(x.year_level).toLowerCase())||norm(x.year_level)===norm(s.year_level));
  return facultyOK&&majorOK&&typeOK&&yearOK;
}

function v3TimeToActivity(a){
  let d=activityStartDate(a); if(!d)return '';
  let ms=d-new Date();

  let mins=Math.floor(ms/60000),days=Math.floor(mins/1440),hrs=Math.floor((mins%1440)/60);
  if(days>0)return `อีก ${days} วัน${hrs?` ${hrs} ชม.`:''}`;
  if(hrs>0)return `อีก ${hrs} ชม.`;
  return `อีก ${Math.max(1,mins)} นาที`;
}

function activityStartDate(a){
  if(!a?.activity_date||!a?.start_time)return null;
  return new Date(`${a.activity_date}T${String(a.start_time).slice(0,8)}`);
}
function cancellationState(a){
  let start=activityStartDate(a);
  if(!start)return {allowed:false,message:'ไม่พบวันเวลาเริ่มกิจกรรม'};
  let cutoff=new Date(start.getTime()-30*60*1000);
  let now=new Date();
  return {
    allowed:now<cutoff,
    cutoff,
    message:now<cutoff
      ? `ยกเลิกได้ถึง ${cutoff.toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})} น.`
      : 'ไม่สามารถยกเลิกได้ เนื่องจากเหลือเวลาไม่ถึง 30 นาทีก่อนเริ่มกิจกรรม หรือกิจกรรมเริ่มแล้ว'
  };
}

function activityCard(a){let n=regCount(a.id),full=n>=a.capacity,registered=!isAdmin()&&myReg(a.id),eligible=isAdmin()||eligibility(a,studentSelf());let now=new Date(),open=now>=new Date(a.registration_open)&&now<=new Date(a.registration_close);return `<article class="card v3-event overflow-hidden"><div class="aspect-[16/7] bg-slate-100 relative">${a.banner_path?`<img src="${esc(a.banner_path)}" class="w-full h-full object-cover" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'w-full h-full grid place-items-center text-slate-400 text-sm',textContent:'ไม่สามารถโหลดภาพกิจกรรมได้'}))">`:`<div class="w-full h-full grid place-items-center text-slate-300">${icon('image','w-10 h-10')}</div>`}<span class="absolute top-3 right-3 bg-white/90 px-2 py-1 rounded-full text-xs">${n}/${a.capacity} คน</span></div><div class="p-4"><div class="flex items-center justify-between gap-2"><div class="text-xs text-blue-700 font-medium">${esc(a.activity_code)}</div><span class="v3-chip">ปีการศึกษา ${esc(a.academic_year||currentAcademicYear())}</span></div><h3 class="font-semibold text-lg mt-1">${esc(a.title)}</h3><p class="text-sm text-slate-500 mt-2">${icon('calendar','w-4 h-4 inline')} ${fmtDate(a.activity_date)} · ${a.start_time.slice(0,5)} น.</p><p class="text-sm text-slate-500 mt-1">${icon('map-pin','w-4 h-4 inline')} ${esc(a.appointment_location||'-')}</p><div class="flex gap-2 mt-4">${isAdmin()?`<button onclick="activityForm('${a.id}')" class="btn btn-soft flex-1">แก้ไข</button><button onclick="deleteActivity('${a.id}')" class="btn bg-slate-100">${icon('trash-2')}</button>`:`${registered?(()=>{let reg=registrations.find(r=>r.activity_id===a.id&&r.student_id===currentStudentId()&&r.registration_status==='registered');let att=reg?attendance.find(x=>x.activity_id===a.id&&x.student_id===currentStudentId()):null;let checked=att&&['present','late','absent'].includes(normalizeAttendanceStatus(att.attendance_status));let cs=cancellationState(a);return `<div c async function compressImage(file){return new Promise((res,rej)=>{let img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{let max=1600,scale=Math.min(1,max/img.width),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(url);b?res(b):rej(new Error('บีบอัดภาพไม่สำเร็จ'))},'image/webp',.72)};img.onerror=()=>rej(new Error('อ่านไฟล์ภาพไม่สำเร็จ'));img.src=url})}

function editRegisteredBenefit(id){
  let a=activities.find(x=>x.id===id); if(!a)return;
  let reg=registrations.find(r=>r.activity_id===id&&r.student_id===currentStudentId()&&r.registration_status==='registered');
  if(!reg)return toast('ไม่พบรายการลงทะเบียน','err');
  let att=attendance.find(x=>x.activity_id===a.id&&x.student_id===currentStudentId());
  if(att && ['present','late','absent'].includes(att.attendance_status)){
    return toast('ไม่สามารถแก้ไขสิทธิประโยชน์ได้ เนื่องจากเจ้าหน้าที่เช็กชื่อแล้ว','err');

  let opts=benefits.filter(x=>x.activity_id===id).map(x=>x.benefit_type);
  modal(`<form onsubmit="saveRegisteredBenefit(event,'${id}')">
    <div class="flex justify-between items-start gap-4">
      <div><h3 class="text-xl font-semibold">แก้ไขสิทธิประโยชน์</h3><p class="text-sm text-slate-600 mt-1">${esc(a.title)}</p></div>

async function filterStudents(immediate=false){
  if(!isAdmin())return;
  clearTimeout(studentSearchTimer);
  const run=async()=>{
    let q=($('#stuSearch')?.value||'').trim(),body=$('#studentRows'); if(!body)return;
    body.innerHTML=`<tr><td colspan="5" class="p-8 text-center text-slate-400">กำลังโหลดข้อมูล...</td></tr>`;
    try{
      let from=(studentPage-1)*studentPageSize,to=from+studentPageSize-1;
      let clean=q.replace(/[,%()]/g,' ').replace(/\s+/g,' ').trim();
      let arr=[],count=0;
      if(clean && /^\d+$/.test(clean)){
        // ค้นหารหัสแบบตรงตัวก่อน ไม่ใช้ range เพื่อไม่ให้ pagination บังผลค้นหา
        let direct=await dbClient.from('students').select('*',{count:'exact'}).eq('student_code',clean).order('student_code');
        if(direct.error)throw direct.error;
        arr=direct.data||[]; count=direct.count||arr.length;
        // รองรับฐานข้อมูลเก่าที่ users.username มีรหัส แต่ students/student_id เชื่อมไม่ครบ
        if(!arr.length){
          let uq=await dbClient.from('users').select('student_id,username').eq('username',clean).limit(1);
          if(uq.error)throw uq.error;
          let uid=uq.data?.[0]?.student_id;
          if(uid){
            let sq=await dbClient.from('students').select('*').eq('id',uid).limit(1);
            if(sq.error)throw sq.error; arr=sq.data||[]; count=arr.length;
          }
        }
      }else{
        let query=dbClient.from('students').select('*',{count:'exact'}).order('student_code').range(from,to);
        if(clean) query=query.or(`full_name.ilike.%${clean}%,faculty.ilike.%${clean}%,major.ilike.%${clean}%`);
        let result=await query;if(result.error)throw result.error;
        arr=result.data||[]; count=result.count||0;
      }
      students=arr;studentTotal=count||0;
      body.innerHTML=arr.length?arr.map(s=>`<tr class="border-t hover:bg-blue-50/40"><td class="p-3 font-medium text-blue-950">${esc(s.student_code)}</td><td class="p-3">${esc(s.full_name)}</td><td class="p-3"><div>${esc(s.faculty)}</div><small class="text-slate-500">${esc(s.major)}</small></td><td class="p-3 text-center">${esc(s.year_level)}</td><td class="p-3 no-print whitespace-nowrap"><button onclick="studentForm('${s.id}')" class="p-2 text-blue-700">${icon('pencil','w-4')}</button><button onclick="deleteStudent('${s.id}')" class="p-2 text-slate-500">${icon('trash-2','w-4')}</button></td></tr>`).join(''):`<tr><td colspan="5" class="p-8 text-center text-slate-400">ไม่พบนักศึกษา</td></tr>`;
      let pages=Math.max(1,Math.ceil(studentTotal/studentPageSize)); if(clean&&/^\d+$/.test(clean))studentPage=1;
      $('#studentCountText').textContent=q?`พบ ${studentTotal.toLocaleString()} รายการ`:`นักศึกษาทั้งหมด ${studentTotal.toLocaleString()} คน · แสดงครั้งละ ${studentPageSize} คน`;
      $('#studentPager').innerHTML=`<button class="btn bg-white border" ${studentPage<=1?'disabled':''} onclick="studentPage--;filterStudents(true)">← ก่อนหน้า</button><span class="text-sm text-slate-500">หน้า ${studentPage.toLocaleString()} / ${pages.toLocaleString()}</span><button class="btn bg-white border" ${studentPage>=pages?'disabled':''} onclick="studentPage++;filterStudents(true)">ถัดไป →</button>`;
      refreshIcons();
    }catch(err){body.innerHTML=`<tr><td colspan="5" class="p-8 text-center text-red-500">${esc(err.message)}</td></tr>`;toast(err.message,'err')}
  };
  if(immediate)await run(); else studentSearchTimer=setTimeout(run,300);
}

function importValue(row,names){
  for(let n of names)if(row[n]!==undefined&&row[n]!==null)return String(row[n]).trim();
  return '';
}
async function previewStudentImport(e){
  let file=e.target.files?.[0]; if(!file)return;
  try{
    let buf=await file.arrayBuffer(),wb=XLSX.read(buf,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];
    let raw=XLSX.utils.sheet_to_json(ws,{defval:''});
    let rows=raw.map(r=>({
      student_code:importValue(r,['รหัสนักศึกษา','student_code','รหัส']),
      full_name:importValue(r,['ชื่อ - สกุล','ชื่อ-สกุล','ชื่อสกุล','full_name']),
      faculty:importValue(r,['คณะ','faculty']),
      major:importValue(r,['สาขา','สาขาวิชา','major']),
      year_level:importValue(r,['ชั้นปี','ปี','ชั้นปี/สถานะ','สถานะชั้นปี','year_level']),
      student_type:importValue(r,['ประเภทนักศึกษา','ประเภท','student_type'])||'นักศึกษาทั่วไป',
      phone:(()=>{let v=importValue(r,['เบอร์โทรศัพท์','โทรศัพท์','เบอร์โทร','หมายเลขโทรศัพท์','phone']);return (!v||v==='-')?'':v})()
    })).filter(r=>r.student_code||r.full_name);
    let invalid=rows.filter(r=>!r.student_code||!r.full_name||!r.faculty||!r.major||!r.year_level);
    window.studentImportRows=invalid.length?[]:rows;
    $('#confirmStudentImport').disabled=!rows.length||!!invalid.length;
    $('#studentImportPreview').innerHTML=`<div class="card p-4"><div class="flex justify-between"><b>ตรวจสอบข้อมูลก่อนนำเข้า</b><span class="${invalid.length?'text-red-600':'text-emerald-600'}">${rows.length} รายการ</span></div>${invalid.length?`<p class="text-sm text-red-600 mt-2">พบข้อมูลไม่ครบ/ไม่มีข้อมูลชั้นปีหรือสถานะ ${invalid.length} รายการ กรุณาแก้ไฟล์ก่อนนำเข้า</p>`:`<p class="text-sm text-emerald-700 mt-2">ข้อมูลพร้อมนำเข้า</p>`}<div class="overflow-x-auto max-h-72 mt-3"><table class="w-full text-xs"><thead class="bg-slate-50"><tr><th class="p-2 text-left">รหัส</th><th class="p-2 text-left">ชื่อ</th><th class="p-2 text-left">คณะ/สาขา</th><th class="p-2">ปี</th></tr></thead><tbody>${rows.slice(0,100).map(r=>`<tr class="border-t"><td class="p-2">${esc(r.student_code)}</td><td class="p-2">${esc(r.full_name)}</td><td class="p-2">${esc(r.faculty)}<br><span class="text-slate-500">${esc(r.major)}</span></td><td class="p-2 text-center">${r.year_level||'-'}</td></tr>`).join('')}</tbody></table></div>${rows.length>100?'<p class="text-xs text-slate-500 mt-2">แสดงตัวอย่าง 100 รายการแรก</p>':''}</div>`;
  }catch(err){window.studentImportRows=[];$('#confirmStudentImport').disabled=true;toast('ไม่สามารถอ่านไฟล์ได้: '+err.message,'err')}
}
async function confirmStudentImport(){
  let rows=window.studentImportRows||[]; if(!rows.length)return;
  const BATCH_SIZE=100;
  let ok=await confirmDialog({
    title:'ยืนยันการนำเข้ารายชื่อ',
    message:`นำเข้านักศึกษา ${rows.length.toLocaleString()} รายการ ระบบจะแบ่งนำเข้าครั้งละ ${BATCH_SIZE} คน เพื่อลดปัญหา Timeout โดยรหัสนักศึกษาจะเป็น Username และ Password ครั้งแรก`,
    confirmText:'เริ่มนำเข้า'
  });
  if(!ok)return;

  let total=rows.length,done=0,created=0,updated=0,failed=0,failedRows=[],batchNo=0;
  closeModal();
  modal(`<div class="max-w-xl">
    <div class="flex items-start gap-3"><div class="w-11 h-11 rounded-xl bg-blue-100 text-blue-700 grid place-items-center">${icon('upload-cloud')}</div><div><h3 class="text-xl font-semibold">กำลังนำเข้ารายชื่อนักศึกษา</h3><p class="text-sm text-slate-500">กรุณาอย่าปิดหน้าเว็บจนกว่าการนำเข้าจะเสร็จ</p></div></div>
    <div class="mt-6"><div class="flex justify-between text-sm mb-2"><span id="importProgressText">0 / ${total.toLocaleString()} คน</span><b id="importProgressPct">0%</b></div><div class="h-3 bg-slate-100 rounded-full overflow-hidden"><div id="importProgressBar" class="h-full bg-blue-600 transition-all duration-300" style="width:0%"></div></div></div>
    <div class="grid grid-cols-3 gap-3 mt-5 text-center"><div class="rounded-xl bg-emerald-50 p-3"><div id="importCreated" class="text-xl font-semibold text-emerald-700">0</div><div class="text-xs text-slate-500">เพิ่มใหม่</div></div><div class="rounded-xl bg-blue-50 p-3"><div id="importUpdated" class="text-xl font-semibold text-blue-700">0</div><div class="text-xs text-slate-500">อัปเดต</div></div><div class="rounded-xl bg-red-50 p-3"><div id="importFailed" class="text-xl font-semibold text-red-700">0</div><div class="text-xs text-slate-500">ผิดพลาด</div></div></div>
    <p id="importBatchText" class="text-xs text-slate-500 mt-4">กำลังเตรียมข้อมูล...</p>
    <div id="importFinishActions" class="hidden mt-5"><button onclick="closeModal();loadAll().then(()=>{renderStudents();toast('โหลดข้อมูลล่าสุดแล้ว')})" class="btn btn-primary w-full">เสร็จสิ้นและโหลดรายชื่อ</button><button id="importErrorDownload" onclick="downloadImportErrors()" class="btn bg-red-50 text-red-700 w-full mt-2 hidden">ดาวน์โหลดรายการที่นำเข้าไม่สำเร็จ</button></div>
  </div>`);
  refreshIcons();

  const paint=()=>{
    let pct=Math.round(done/total*100);
    let e=id=>document.getElementById(id);
    if(e('importProgressText'))e('importProgressText').textContent=`${done.toLocaleString()} / ${total.toLocaleString()} คน`;
    if(e('importProgressPct'))e('importProgressPct').textContent=`${pct}%`;
    if(e('importProgressBar'))e('importProgressBar').style.width=`${pct}%`;
    if(e('importCreated'))e('importCreated').textContent=created.toLocaleString();
    if(e('importUpdated'))e('importUpdated').textContent=updated.toLocaleString();
    if(e('importFailed'))e('importFailed').textContent=failed.toLocaleString();
  };

  for(let i=0;i<rows.length;i+=BATCH_SIZE){
    let batch=rows.slice(i,i+BATCH_SIZE); batchNo++;
    let label=document.getElementById('importBatchText');
    if(label)label.textContent=`กำลังนำเข้าชุดที่ ${batchNo} · รายการ ${i+1}-${Math.min(i+BATCH_SIZE,total)}`;
    try{
      let result=await safe(dbClient.rpc('import_students',{p_students:batch}));
      created+=result?.filter?.(x=>x.action==='created').length||0;
      updated+=result?.filter?.(x=>x.action==='updated').length||0;
    }catch(err){
      // ถ้าชุด 100 คนล้มเหลว ให้แยกลองทีละคน เพื่อไม่ให้ข้อมูลดีถูกข้าม
      if(label)label.textContent=`ชุดที่ ${batchNo} มีข้อผิดพลาด กำลังตรวจทีละรายการ...`;
      for(let row of batch){
        try{
          let result=await safe(dbClient.rpc('import_students',{p_students:[row]}));
          created+=result?.filter?.(x=>x.action==='created').length||0;
          updated+=result?.filter?.(x=>x.action==='updated').length||0;
        }catch(oneErr){
          failed++;
          failedRows.push({...row,error:oneErr.message||String(oneErr)});
        }
        done++; paint();
      }
      continue;
    }
    done+=batch.length; paint();
  }

  window.studentImportErrors=failedRows;
  let label=document.getElementById('importBatchText');
  if(label)label.innerHTML=failed
    ? `<span class="text-amber-700">นำเข้าเสร็จแล้ว แต่มี ${failed.toLocaleString()} รายการที่ไม่สำเร็จ</span>`
    : `<span class="text-emerald-700">นำเข้ารายชื่อนักศึกษาเสร็จสมบูรณ์</span>`;
  document.getElementById('importFinishActions')?.classList.remove('hidden');
  if(failed)document.getElementById('importErrorDownload')?.classList.remove('hidden');
  toast(failed?`นำเข้าเสร็จ: สำเร็จ ${(created+updated).toLocaleString()} / ผิดพลาด ${failed.toLocaleString()}`:`นำเข้าสำเร็จ ${total.toLocaleString()} รายการ`,failed?'err':'ok');
}
function downloadImportErrors(){
  let data=window.studentImportErrors||[]; if(!data.length)return;
  let rows=[['รหัสนักศึกษา','ชื่อ - สกุล','คณะ','สาขา','ชั้นปี/สถานะ','ประเภทนักศึกษา','เบอร์โทรศัพท์','สาเหตุ'],...data.map(x=>[x.student_code,x.full_name,x.faculty,x.major,x.year_level,x.student_type,x.phone,x.error])];
  let csv='\ufeff'+rows.map(r=>r.map(v=>`"${String(v??'').replaceAll('"','""')}"`).join(',')).join('\n');
  let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=url;a.download='student_import_errors.csv';a.click();URL.revokeObjectURL(url);
}

function togglePassword(id,btn){
  let input=document.getElementById(id); if(!input)return;
  input.type=input.type==='password'?'text':'password';
  btn.innerHTML=icon(input.type==='password'?'eye':'eye-off','w-4 h-4'); refreshIcons();

async function saveStudent(e,id){
  e.preventDefault();
  let f=new FormData(e.target);
  let p={
    student_code:(f.get('student_code')||'').trim(),
    full_name:(f.get('full_name')||'').trim(),
    faculty:f.get('faculty'),
    major:(f.get('major')||'').trim(),
    year_level:+f.get('year_level'),
    student_type:f.get('student_type'),
    phone:(f.get('phone')||'').trim()
  };
  loading(true,id?'กำลังบันทึกข้อมูลนักศึกษา...':'กำลังสร้างนักศึกษาและบัญชีผู้ใช้...');
  let newStudentId=null;
  try{
    if(id){
      await safe(dbClient.from('students').update(p).eq('id',id));
      let linked=users.find(u=>u.student_id===id);
      if(linked){
        await safe(dbClient.from('users').update({username:p.student_code,full_name:p.full_name}).eq('id',linked.id));
      }
      closeModal(); await loadAll(); renderStudents(); toast('แก้ไขข้อมูลนักศึกษาเรียบร้อยแล้ว');
    }else{
      let initialPassword=p.student_code;
      if(students.some(s=>s.student_code===p.student_code))throw new Error('รหัสนักศึกษานี้มีอยู่ในระบบแล้ว');
      if(users.some(u=>u.username===p.student_code))throw new Error('ชื่อผู้ใช้งานนี้มีอยู่ในระบบแล้ว');

      let stu=await safe(dbClient.from('students').insert(p).select().single());
      newStudentId=stu.id;
      let usr=await safe(dbClient.from('users').insert({
        username:p.student_code,
        password_hash:'TEMP',
        full_name:p.full_name,
        role:'student',
        student_id:stu.id,
        is_active:true,
        force_password_change:true
      }).select('id').single());
      await safe(dbClient.rpc('set_user_password',{p_user_id:usr.id,p_new_password:initialPassword}));

async function fetchStudentsByIds(ids){

}

async function saveUser(e,id){

    is_active:f.has('is_active')
  };

    let uid=id;

      p.password_hash='TEMP';

async function saveAcademicYear(e){
  e.preventDefault();let f=new FormData(e.target),y=Number(f.get('academic_year')),start=f.get('start_date'),end=f.get('end_date');
  if(new Date(start)>new Date(end))return toast('วันเริ่มต้องไม่เกินวันสิ้นสุด','err');
  loading(true,'กำลังบันทึกปีการศึกษา...');
  try{
    await safe(dbClient.from('academic_years').upsert({academic_year:y,start_date:start,end_date:end,is_active:false},{onConflict:'academic_year'}));
    if(f.has('is_active'))await safe(dbClient.rpc('set_active_academic_year',{p_academic_year:y}));
    closeModal();await loadAll();renderAcademicYears();toast('บันทึกปีการศึกษาแล้ว');
  }catch(err){toast(err.message,'err')}finally{loading(false)}
}

        <td class="p-3"><span class="px-2.5 py-1 rounded-full text-xs font-semibold ${reg?'bg-blue-50 text-blue-700':'bg-amber-50 text-amber-700'}">${reg?'ลงทะเบียน':'ยกเลิกลงทะเบียน'}</span></td>
      </tr>`;
    }).join(''):`<tr><td colspan="5" class="p-10 text-center text-slate-400">ไม่พบข้อมูล Log การลงทะเบียนกิจกรรม</td></tr>`;
  };
  $('#regLogSearch').oninput=draw;$('#regLogType').onchange=draw;draw();refreshIcons();
}
async function refreshRegistrationLogs(){
  loading(true,'กำลังโหลด Log การลงทะเบียน...');
  try{systemLogs=await loadSystemLogs();renderRegistrationLogs()}catch(e){toast(e.message,'err')}finally{loading(false)}
}

function renderProfile(){
  if(isStaff()){
    $('#content').innerHTML=`<div class="max-w-3xl mx-auto"><div class="v3-hero p-6 mb-5"><p class="text-blue-100 text-sm">STAFF PROFILE</p><h2 class="text-2xl font-semibold mt-1">${esc(session.full_name||session.username)}</h2><p class="text-blue-100 mt-1">เจ้าหน้าที่ / Staff</p></div><div class="card p-6"><h3 class="text-xl font-semibold">ข้อมูลบัญชี</h3><p class="text-sm text-slate-500 mt-3">Username: ${esc(session.username)}</p><p class="text-sm text-slate-500 mt-1">คณะที่รับผิดชอบกำหนดโดยผู้ดูแลระบบ</p><button onclick="passwordModal()" class="btn btn-soft mt-5">เปลี่ยนรหัสผ่าน</button></div></div>`;refreshIcons();return;
  }

  let s=studentSelf();
  if(s&&session.student_id!==s.id){session.student_id=s.id;sessionStorage.setItem('activity_session',JSON.stringify(session));}
  if(!s){
    $('#content').innerHTML=`<div class="card p-6 max-w-2xl"><h3 class="text-xl font-semibold">ข้อมูลส่วนตัว</h3><p class="text-slate-500 mt-3">Username: ${esc(session.username)}</p><button onclick="passwordModal()" class="btn btn-soft mt-5">เปลี่ยนรหัสผ่าน</button></div>`;refreshIcons();return;
  }
  $('#content').innerHTML=`<div class="max-w-4xl mx-auto">
    <div class="v3-student-card p-6 md:p-7 mb-5"><p class="text-blue-100 text-sm">DIGITAL STUDENT PROFILE</p><h2 class="text-2xl font-semibold mt-1">${esc(s.full_name)}</h2><p class="text-blue-100 mt-1">${esc(s.student_code)} · ${esc(s.faculty)}</p></div>
    <form onsubmit="saveMyProfile(event)" class="card p-5 md:p-7">
      <div class="flex items-center justify-between gap-3 mb-6"><div><h3 class="text-xl font-semibold">ข้อมูลของฉัน</h3><p class="text-sm text-slate-500 mt-1">คุณสามารถแก้ไขข้อมูลของตนเองได้ ยกเว้นรหัสนักศึกษา</p></div><div class="w-11 h-11 rounded-xl bg-blue-50 text-blue-700 grid place-items-center">${icon('user-round-cog')}</div></div>
      <div class="grid md:grid-cols-2 gap-4">
        <div><label class="label">รหัสนักศึกษา</label><input class="input bg-slate-100 text-slate-500 cursor-not-allowed" value="${esc(s.student_code)}" readonly disabled><p class="text-[11px] text-slate-400 mt-1">ไม่อนุญาตให้แก้ไข</p></div>
        <div><label class="label">ชื่อ - สกุล</label><input name="full_name" class="input" value="${esc(s.full_name||'')}" required></div>
        <div><label class="label">คณะ</label><select name="faculty" class="input" required><option value="">เลือกคณะ</option>${faculties.map(x=>`<option value="${esc(x)}" ${x===s.faculty?'selected':''}>${esc(x)}</option>`).join('')}${s.faculty&&!faculties.includes(s.faculty)?`<option value="${esc(s.faculty)}" selected>${esc(s.faculty)}</option>`:''}</select></div>
        <div><label class="label">สาขาวิชา</label><select name="major" class="input" required><option value="">เลือกสาขาวิชา</option>${majors.map(x=>`<option value="${esc(x)}" ${x===s.major?'selected':''}>${esc(x)}</option>`).join('')}${s.major&&!majors.includes(s.major)?`<option value="${esc(s.major)}" selected>${esc(s.major)}</option>`:''}</select></div>
        <div><label class="label">ชั้นปี / สถานะ</label><input class="input bg-slate-100 text-slate-600 cursor-not-allowed" value="${esc(derivedYearLevel(s.student_code)||s.year_level||'')}" readonly disabled><p class="text-[11px] text-slate-400 mt-1">ระบบอัปเดตอัตโนมัติตามปีการศึกษา ${currentAcademicYear()}</p></div>
        <div><label class="label">ประเภทนักศึกษา</label><select name="student_type" class="input" required><option value="">เลือกประเภทนักศึกษา</option>${studentTypes.map(x=>`<option value="${esc(x)}" ${x===s.student_type?'selected':''}>${esc(x)}</option>`).join('')}${s.student_type&&!studentTypes.includes(s.student_type)?`<option value="${esc(s.student_type)}" selected>${esc(s.student_type)}</option>`:''}</select></div>
        <div class="md:col-span-2"><label class="label">เบอร์โทรศัพท์</label><input name="phone" class="input" value="${esc(s.phone||'')}" placeholder="เช่น 0812345678 หรือ 081-2345678"></div>
      </div>
      <div class="flex flex-col sm:flex-row gap-3 mt-6"><button class="btn btn-primary sm:min-w-44">${icon('save','w-4 inline')} บันทึกข้อมูล</button><button type="button" onclick="passwordModal()" class="btn btn-soft sm:min-w-44">${icon('key-round','w-4 inline')} เปลี่ยนรหัสผ่าน</button></div>
    </form>
  </div>`;refreshIcons();
}
async function saveMyProfile(e){
  e.preventDefault(); let s=studentSelf(); if(!s)return;
  let f=new FormData(e.target),payload={
    full_name:(f.get('full_name')||'').trim(),faculty:(f.get('faculty')||'').trim(),major:(f.get('major')||'').trim(),
    student_type:(f.get('student_type')||'').trim(),phone:(f.get('phone')||'').trim()||null
  };
  if(!payload.full_name||!payload.faculty||!payload.major||!payload.student_type)return toast('กรุณากรอกข้อมูลให้ครบ','err');
  loading(true,'กำลังบันทึกข้อมูลของคุณ...');
  try{
    await safe(dbClient.from('students').update(payload).eq('id',s.id));
    await safe(dbClient.from('users').update({full_name:payload.full_name,student_id:s.id}).eq('id',session.id));
    session.full_name=payload.full_name;sessionStorage.setItem('activity_session',JSON.stringify(session));$('#headerName').textContent=payload.full_name;
    await loadAll();await syncMyAcademicYear();renderProfile();toast('บันทึกข้อมูลของคุณเรียบร้อยแล้ว');
  }catch(err){toast(err.message,'err')}finally{loading(false)}
}
function passwordModal(){modal(`<form onsubmit="changePassword(event)"><h3 class="text-xl font-semibold">เปลี่ยนรหัสผ่าน</h3><label class="label mt-4">รหัสผ่านใหม่</label><input name="password" type="password" minlength="4" class="input" required><div class="flex gap-3 mt-5"><button type="button" onclick="closeModal()" class="btn bg-slate-100 flex-1">ยกเลิก</button><button class="btn btn-primary flex-1">บันทึก</button></div></form>`)} async function changePassword(e){e.preventDefault();try{await safe(dbClient.rpc('set_user_password',{p_user_id:session.id,p_new_password:new FormData(e.target).get('password')}));closeModal();toast('เปลี่ยนรหัสผ่านแล้ว')}catch(e){toast(e.message,'err')}}
(async()=>{let remembered=localStorage.getItem('remember_username');if(remembered){$('#loginUsername').value=remembered;$('#rememberMe').checked=true}let ss=sessionStorage.getItem('activity_session');if(ss){try{session=JSON.parse(ss);await enterApp()}catch{sessionStorage.removeItem('activity_session')}}refreshIcons()})();
</script></body></html>
